# Vercel と同じ Linux で本番ビルドを再現。main への push / PR で失敗を先に検知する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            daw-studio/package-lock.json
            dtm-studio/package-lock.json
            video-studio/package-lock.json
            photo-studio/package-lock.json

      - name: Repo checks (deps, no node_modules in git)
        run: npm run verify

      - name: Install app dependencies (for tests)
        run: |
          npm ci --prefix daw-studio
          npm ci --prefix dtm-studio
          npm ci --prefix video-studio
          npm ci --prefix photo-studio

      - name: Unit tests (DAW / DTM / Video / Photo)
        run: npm test

      - name: Production build (same as Vercel)
        run: npm run build
        env:
          VITE_BASE: /
